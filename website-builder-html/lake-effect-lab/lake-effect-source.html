<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<title>Lake Effect Snow Forecaster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500&family=Noto+Sans+Arabic:wght@400;700&display=swap">
<style>
:root{
  --bg:#EDF1F5; --surface:#FFFFFF; --surface-2:#F4F7FA; --ink:#14202D; --muted:#4F5F70; --line:#C9D3DE;
  --accent:#4A3BC4; --accent-ink:#FFFFFF; --accent-soft:#E7E4FA;
  --l2c:#7A4A12;
  --good:#1D7A4B; --good-soft:#E2F2E9; --bad:#B0301F; --bad-soft:#FBE6E2;
  --focus:#2563EB;
  --land:#E3E8E0; --land-2:#D5DCD2; --land-edge:#8E9C94; --water:#6EA6D8; --water-2:#4F8CC4; --water-ink:#0F3A63;
  --sky:#DCE8F3; --sky-2:#EEF4FA; --cloud:#C3CCD5; --cloud-2:#8F9BA8; --snow:#FFFFFF; --snow-edge:#9DB0C2;
  --cold:#2F74C0; --warm:#D0561F; --hi:#1F5AA6; --lo:#9A2E6E; --halo:#FFFFFF; --map-ink:#1C2A38; --map-muted:#5E6C7A;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --arabic:"Noto Sans Arabic","Geeza Pro","Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0B1219; --surface:#121C27; --surface-2:#182432; --ink:#E6EDF5; --muted:#9EAFC1; --line:#2B3A4B;
    --accent:#AAB4FF; --accent-ink:#12173A; --accent-soft:#252B5E;
    --l2c:#E8C07A;
    --good:#5CCB8E; --good-soft:#10301F; --bad:#F08A76; --bad-soft:#3A1712;
    --focus:#6FB2F2;
    --land:#26303A; --land-2:#2E3945; --land-edge:#56657A; --water:#2C5A88; --water-2:#23496F; --water-ink:#CFE3F7;
    --sky:#15212E; --sky-2:#1B2938; --cloud:#56626F; --cloud-2:#8995A2; --snow:#EEF3F8; --snow-edge:#8093A6;
    --cold:#7DB6F0; --warm:#F29058; --hi:#8DB8F2; --lo:#E58CC0; --halo:#0B1219; --map-ink:#E6EDF5; --map-muted:#A7B5C3;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B1219; --surface:#121C27; --surface-2:#182432; --ink:#E6EDF5; --muted:#9EAFC1; --line:#2B3A4B;
  --accent:#AAB4FF; --accent-ink:#12173A; --accent-soft:#252B5E;
  --l2c:#E8C07A;
  --good:#5CCB8E; --good-soft:#10301F; --bad:#F08A76; --bad-soft:#3A1712;
  --focus:#6FB2F2;
  --land:#26303A; --land-2:#2E3945; --land-edge:#56657A; --water:#2C5A88; --water-2:#23496F; --water-ink:#CFE3F7;
  --sky:#15212E; --sky-2:#1B2938; --cloud:#56626F; --cloud-2:#8995A2; --snow:#EEF3F8; --snow-edge:#8093A6;
  --cold:#7DB6F0; --warm:#F29058; --hi:#8DB8F2; --lo:#E58CC0; --halo:#0B1219; --map-ink:#E6EDF5; --map-muted:#A7B5C3;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:10px 24px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
p{margin:0}
.en{display:block}
.l2{display:block;color:var(--l2c);font-size:.8em;line-height:1.35;margin-top:1px}
.l2[dir="rtl"]{font-family:var(--arabic);text-align:right}
.inl .en,.inl .l2{display:inline}
.inl .l2::before{content:" / ";color:var(--muted)}
.inl .l2[dir="rtl"]{unicode-bidi:isolate}
.inl .l2[dir="rtl"]::before{content:none}
.inl .l2[dir="rtl"]::after{content:" / ";color:var(--muted)}
bdi{unicode-bidi:isolate}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:6px 10px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand svg{flex:none}
.brand h1{font-size:1.45rem;font-weight:800;letter-spacing:-.01em}
.brand p{color:var(--muted);font-size:.9rem}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tools label{font-size:.85rem;color:var(--muted);display:flex;align-items:center;gap:6px}
select,input[type=text]{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-height:38px;padding:4px 10px}
.btn{min-height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:6px 14px;cursor:pointer;font-weight:700;text-align:left}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary .l2{color:inherit;opacity:.85}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.say{flex:none;width:32px;height:32px;min-width:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);display:inline-grid;place-items:center;cursor:pointer;padding:0;color:var(--ink)}
.say:hover{border-color:var(--accent)}
.txt{display:flex;gap:8px;align-items:flex-start}
.txt>div,.txt>p{flex:1;min-width:0}

/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:12px}
.tab{border:0;background:none;padding:8px 14px 9px;border-bottom:3px solid transparent;cursor:pointer;font-weight:700;color:var(--muted);text-align:left;min-height:44px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.chip{font-family:var(--mono);font-size:13px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:0 7px;color:var(--muted);font-variant-numeric:tabular-nums}

.part{display:flex;flex-direction:column;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.eyebrow{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:0 0 6px}
.eyebrow .l2{text-transform:none;letter-spacing:0}
.note{font-size:.9rem;color:var(--muted)}

/* learn */
.hero{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:18px;align-items:center}
.hero h2{font-size:clamp(1.9rem,4vw,2.8rem);font-weight:800;letter-spacing:-.02em;margin-bottom:10px}
.hero .lead{font-size:1.02rem;max-width:62ch}
.hero .btn{margin-top:14px}
.xsec{width:100%;height:auto;display:block;border-radius:14px;border:1px solid var(--line)}
.cap{font-size:13px;color:var(--muted);margin-top:6px}
.steps4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.step{display:flex;flex-direction:column;gap:6px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.step .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:500 14px var(--mono);background:var(--map-ink);color:var(--surface)}
.step h3{font-size:1.02rem}
.step p{font-size:.93rem}
.conds{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.cond{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:12px}
.cond .ico{width:100%;height:70px;border-radius:10px;background:var(--sky);display:grid;place-items:center}
.cond h3{font-size:1.02rem}
.cond p{font-size:.93rem}
@media (max-width:980px){.hero{grid-template-columns:minmax(0,1fr)}.steps4,.conds{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.steps4,.conds{grid-template-columns:minmax(0,1fr)}}

/* forecast */
.dots{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dot{min-width:40px;height:40px;border-radius:20px;border:1px solid var(--line);background:var(--surface);font:500 14px var(--mono);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:3px;padding:0 8px;color:var(--ink)}
.dot:hover{border-color:var(--accent)}
.dot[aria-current="step"]{border:2px solid var(--accent);background:var(--accent-soft)}
.dot.ok{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.dot.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.dot[aria-current="step"].ok,.dot[aria-current="step"].no{outline:2px solid var(--accent);outline-offset:1px}
.fgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:900px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.mapbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px}
.map{display:block;width:100%;height:auto;max-height:calc(100vh - 290px);min-height:220px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);padding:6px 4px 2px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.side{display:flex;flex-direction:column;gap:12px}
.cityhead{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.cityhead h2{font-size:1.35rem}
.pnote{display:flex;gap:8px;align-items:flex-start;font-size:.93rem;color:var(--muted);margin-top:6px}
.tiles{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr) minmax(0,1fr);gap:8px}
@media (max-width:520px){.tiles{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.tiles .t-temp{grid-column:1/-1}}
.tile{border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--surface-2);display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .tl{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tile .tl .l2{text-transform:none;letter-spacing:0}
.tile svg{display:block;margin:0 auto;max-width:100%}
.tile .val{font-weight:700;font-size:.95rem;line-height:1.25}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500}
.tvals{display:flex;justify-content:space-around;gap:6px;text-align:center;font-size:.9rem}
.tvals b{display:block;font-size:13px;color:var(--muted)}
.gap{font-size:.9rem;text-align:center;font-weight:700}
.q h3{font-size:1.08rem}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.yn .btn{min-height:48px;font-size:1.05rem;text-align:center}
.yn .btn[aria-pressed="true"]{border-width:2px;padding:5px 13px}
.amt{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.amt .btn{text-align:center}
.ev textarea{width:100%;min-height:92px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);padding:8px 10px;resize:vertical}
.ev textarea:disabled{opacity:.75}
details.sup summary{cursor:pointer;font-weight:700;min-height:38px;display:flex;align-items:center;gap:6px}
.frames{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.frame{text-align:left;border:1px dashed var(--accent);background:var(--surface);border-radius:10px;padding:6px 10px;cursor:pointer;min-height:38px}
.words{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.word{border:1px solid var(--line);background:var(--surface-2);border-radius:99px;padding:4px 12px;cursor:pointer;min-height:38px}
.word:hover,.frame:hover{border-color:var(--accent);border-style:solid}
.hintbtn{background:none;border:0;padding:4px 0;min-height:38px;color:var(--accent);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-align:left}
.hint{border:1px dashed var(--line);border-radius:10px;padding:8px 10px;background:var(--surface-2);font-size:.95rem}

/* action bar */
.actions{position:sticky;bottom:0;z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:10px;align-items:center;box-shadow:0 -6px 18px rgba(12,20,30,.12)}
.fb{flex:1 1 320px;min-width:0;max-height:26vh;overflow:auto;display:flex;gap:8px;align-items:flex-start;font-size:.95rem;border-radius:10px;padding:6px 8px;border:1px solid transparent}
.fb.good{background:var(--good-soft);border-color:var(--good)}
.fb.bad{background:var(--bad-soft);border-color:var(--bad)}
.act-btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.count{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

/* vocab */
.vocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.vcard{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface-2)}
.vcard .pic{flex:none;width:64px;height:64px;border-radius:10px;background:var(--sky);display:grid;place-items:center}
.vcard b{font-size:1rem}
.vcard p{font-size:.9rem}

/* turn in */
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.9rem}
.bonus textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);padding:8px 10px;resize:vertical}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.sum{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface-2)}
.sum b{font-family:var(--mono);font-size:1.2rem;font-variant-numeric:tabular-nums}
.rec{width:100%;min-height:260px;font-family:var(--mono);font-size:13px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);padding:10px;white-space:pre}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:.9rem;z-index:20;max-width:calc(100% - 32px)}
.foot{font-size:13px;color:var(--muted);margin-top:18px}
@media (max-width:600px){.actions{position:static;box-shadow:none}.form{grid-template-columns:1fr}}

/* svg fills */
.f-land{fill:var(--land)} .f-land2{fill:var(--land-2)} .f-water{fill:var(--water)} .f-water2{fill:var(--water-2)} .s-shore{stroke:var(--land-edge)}
.f-sky{fill:var(--sky)} .f-sky2{fill:var(--sky-2)} .f-cloud{fill:var(--cloud)} .f-cloud2{fill:var(--cloud-2)} .f-snow{fill:var(--snow)} .s-snow{stroke:var(--snow-edge)}
.f-cold{fill:var(--cold)} .s-cold{stroke:var(--cold)} .f-warm{fill:var(--warm)} .s-warm{stroke:var(--warm)}
.f-hi{fill:var(--hi)} .f-lo{fill:var(--lo)} .s-hi{stroke:var(--hi)} .s-lo{stroke:var(--lo)}
.f-ink{fill:var(--map-ink)} .s-ink{stroke:var(--map-ink)} .f-mute{fill:var(--map-muted)} .s-mute{stroke:var(--map-muted)}
.f-surf{fill:var(--surface)} .s-halo{stroke:var(--halo)} .f-halo{fill:var(--halo)} .f-wink{fill:var(--water-ink)} .s-line{stroke:var(--line)} .f-line{fill:var(--line)}
.maptxt{font-family:var(--body);font-weight:700}
.lk{font-family:var(--display);font-weight:600;fill:var(--water-ink);letter-spacing:.02em}
.lk .l2t,.maptxt .l2t{font-weight:400;fill:var(--l2c)}
.lk .l2t{fill:var(--water-ink);opacity:.85}
.halo{paint-order:stroke;stroke:var(--halo);stroke-width:5px;stroke-linejoin:round}
@media (prefers-reduced-motion: no-preference){
  .btn,.dot,.frame,.word{transition:border-color .15s, background-color .15s}
  .flake{animation:fall 3.2s linear infinite}
  @keyframes fall{from{transform:translateY(-18px);opacity:0}15%{opacity:1}to{transform:translateY(46px);opacity:0}}
  .windpath{stroke-dasharray:14 10;animation:flow 1.4s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-24}}
  .rise{animation:rise 2.6s ease-in-out infinite}
  @keyframes rise{from{transform:translateY(6px);opacity:.2}50%{opacity:1}to{transform:translateY(-10px);opacity:0}}
}
</style>
<div class="wrap" id="app"></div>
<div class="sr" aria-live="polite" id="live"></div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>

/* ---------- PAGE TEXT IN EVERY LANGUAGE ----------
   Each entry: [English, Español, Français, Kreyòl, العربية]  */
const UI={

noSpeech:["Read-aloud does not work in this browser.","La lectura en voz alta no funciona en este navegador.","La lecture à voix haute ne marche pas dans ce navigateur.","Lekti awotvwa pa mache nan navigatè sa a.","القراءة بصوت عالٍ لا تعمل في هذا المتصفح."],
picsHead:["Word pictures","Palabras con dibujos","Mots en images","Mo ak foto","كلمات بالصور"],
correct:["Correct.","Correcto.","Correct.","Kòrèk.","صحيح."],
notYet:["Not yet.","Todavía no.","Pas encore.","Poko.","ليس بعد."],

/* Learn */
introHead:["Will it snow?","¿Va a nevar?","Va-t-il neiger ?","Èske l ap fè nèj?","هل ستتساقط الثلوج؟"],
intro:["Very cold air blows over a warmer lake. The lake adds heat and water vapor to the air. The air rises and makes snow on the shore where the wind is going. In this lab you will read real weather data for 8 cities. Then you will decide if lake-effect snow will form, and explain why.","Aire muy frío sopla sobre un lago más cálido. El lago le agrega calor y vapor de agua al aire. El aire sube y forma nieve en la orilla hacia donde va el viento. En este laboratorio vas a leer datos reales del tiempo de 8 ciudades. Luego vas a decidir si se formará nieve por efecto lago y vas a explicar por qué.","De l'air très froid souffle au-dessus d'un lac plus chaud. Le lac ajoute de la chaleur et de la vapeur d'eau à l'air. L'air monte et fait de la neige sur la rive où va le vent. Dans ce labo, tu vas lire de vraies données météo pour 8 villes. Ensuite, tu vas décider si de la neige d'effet de lac va se former, et expliquer pourquoi.","Lè ki frèt anpil soufle sou yon lak ki pi cho. Lak la ajoute chalè ak vapè dlo nan lè a. Lè a monte epi li fè nèj sou rivaj kote van an prale a. Nan laboratwa sa a, w ap li vrè done sou tan an pou 8 vil. Apre sa, w ap deside si nèj efè lak ap fòme, epi w ap eksplike poukisa.","يهبّ هواء شديد البرودة فوق بحيرة أدفأ منه. تضيف البحيرة حرارة وبخار ماء إلى الهواء. يرتفع الهواء ويكوّن ثلجًا على الشاطئ الذي تتجه إليه الرياح. في هذا المختبر ستقرأ بيانات طقس حقيقية لثماني مدن. ثم ستقرر هل سيتكوّن ثلج تأثير البحيرة، وتشرح السبب."],
start:["Start forecasting","Empezar a pronosticar","Commencer les prévisions","Kòmanse fè prevwa","ابدأ التوقّع"],
howHead:["How lake-effect snow forms","Cómo se forma la nieve por efecto lago","Comment se forme la neige d'effet de lac","Kijan nèj efè lak fòme","كيف يتكوّن ثلج تأثير البحيرة"],
diagCap:["Side view across a lake in winter. Not to scale.","Vista de lado de un lago en invierno. No está a escala.","Vue de côté d'un lac en hiver. Pas à l'échelle.","Nou gade yon lak sou kote an ivè. Se pa bon mezi yo.","منظر جانبي لبحيرة في الشتاء. الرسم ليس بمقياس حقيقي."],
st1h:["Cold, dry air arrives","Llega aire frío y seco","De l'air froid et sec arrive","Lè frèt e sèk rive","يصل هواء بارد وجاف"],
st1:["Wind brings very cold, dry air over the lake. It often comes after a low-pressure system moves east.","El viento trae aire muy frío y seco sobre el lago. Muchas veces llega después de que un sistema de baja presión se mueve hacia el este.","Le vent apporte de l'air très froid et sec au-dessus du lac. Souvent, il arrive après qu'une dépression s'est déplacée vers l'est.","Van an pote lè ki frèt anpil e ki sèk sou lak la. Souvan li rive apre yon sistèm presyon ba deplase al nan lès.","تجلب الرياح هواءً شديد البرودة وجافًا فوق البحيرة. غالبًا ما يأتي بعد أن يتحرك منخفض جوي نحو الشرق."],
st2h:["The lake adds heat and moisture","El lago agrega calor y humedad","Le lac ajoute chaleur et humidité","Lak la ajoute chalè ak imidite","تضيف البحيرة حرارة ورطوبة"],
st2:["The lake is warmer than the air. Water evaporates into the air, and the lake warms the air from below.","El lago está más cálido que el aire. El agua se evapora hacia el aire, y el lago calienta el aire desde abajo.","Le lac est plus chaud que l'air. L'eau s'évapore dans l'air, et le lac réchauffe l'air par en dessous.","Lak la pi cho pase lè a. Dlo a evapore nan lè a, epi lak la chofe lè a pa anba.","البحيرة أدفأ من الهواء. يتبخر الماء في الهواء، وتدفّئ البحيرة الهواء من الأسفل."],
st3h:["Warm, wet air rises","El aire cálido y húmedo sube","L'air chaud et humide monte","Lè cho e mouye a monte","يرتفع الهواء الدافئ الرطب"],
st3:["Warm air rises. As it rises, it cools, and the water vapor condenses into clouds. The clouds grow as the air crosses more water (a longer fetch).","El aire cálido sube. Al subir, se enfría y el vapor de agua se condensa en nubes. Las nubes crecen cuando el aire cruza más agua (un fetch más largo).","L'air chaud monte. En montant, il se refroidit, et la vapeur d'eau se condense en nuages. Les nuages grossissent quand l'air traverse plus d'eau (un fetch plus long).","Lè cho monte. Pandan l ap monte, li refwadi, epi vapè dlo a kondanse fè nwaj. Nwaj yo grandi lè lè a travèse plis dlo (yon fetch ki pi long).","الهواء الدافئ يرتفع. وعندما يرتفع يبرد، ويتكثف بخار الماء إلى سحب. تكبر السحب كلما عبر الهواء ماءً أكثر (مسافة عبور أطول)."],
st4h:["Snow falls downwind","La nieve cae viento abajo","La neige tombe sous le vent","Nèj tonbe kote van an ale","يتساقط الثلج باتجاه الريح"],
st4:["The clouds drop heavy snow in narrow bands on the shore where the wind is going.","Las nubes dejan caer mucha nieve en franjas angostas en la orilla hacia donde va el viento.","Les nuages laissent tomber beaucoup de neige en bandes étroites sur la rive où va le vent.","Nwaj yo lage anpil nèj an ti bann etwat sou rivaj kote van an prale a.","تُسقط السحب ثلجًا كثيفًا في أشرطة ضيقة على الشاطئ الذي تتجه إليه الرياح."],
checkHead:["Four things forecasters check","Cuatro cosas que revisan los pronosticadores","Quatre choses que vérifient les prévisionnistes","Kat bagay moun k ap fè prevwa yo tcheke","أربعة أشياء يتحقق منها المتنبئون"],
c1h:["Temperature gap","Diferencia de temperatura","Écart de température","Diferans tanperati","فرق درجات الحرارة"],
c1:["The lake must be much warmer than the air. A gap of 23°F (13°C) or more is big. A bigger gap means more energy and more snow.","El lago debe estar mucho más cálido que el aire. Una diferencia de 23°F (13°C) o más es grande. Una diferencia más grande significa más energía y más nieve.","Le lac doit être beaucoup plus chaud que l'air. Un écart de 23°F (13°C) ou plus est grand. Un plus grand écart veut dire plus d'énergie et plus de neige.","Lak la dwe pi cho anpil pase lè a. Yon diferans 23°F (13°C) oswa plis, se gwo. Yon pi gwo diferans vle di plis enèji ak plis nèj.","يجب أن تكون البحيرة أدفأ بكثير من الهواء. الفرق 23°F (13°C) أو أكثر فرق كبير. الفرق الأكبر يعني طاقة أكثر وثلجًا أكثر."],
c2h:["Fetch","Fetch (recorrido sobre el agua)","Fetch (distance sur l'eau)","Fetch (distans sou dlo)","مسافة العبور فوق الماء"],
c2:["Fetch is how far the wind travels over open water. A longer fetch picks up more heat and moisture, so more snow falls.","El fetch es la distancia que recorre el viento sobre agua abierta. Un fetch más largo recoge más calor y humedad, así que cae más nieve.","Le fetch, c'est la distance que le vent parcourt sur l'eau libre. Un fetch plus long ramasse plus de chaleur et d'humidité, donc il tombe plus de neige.","Fetch se distans van an fè sou dlo ouvè. Yon fetch ki pi long ranmase plis chalè ak imidite, kidonk plis nèj tonbe.","مسافة العبور هي المسافة التي تقطعها الرياح فوق مياه مفتوحة. المسافة الأطول تلتقط حرارة ورطوبة أكثر، فيتساقط ثلج أكثر."],
c3h:["Barometer rising","Barómetro subiendo","Baromètre en hausse","Bawomèt k ap monte","ارتفاع البارومتر"],
c3:["After a low-pressure system moves east, high pressure follows with cold northwest winds. A rising barometer signals this setup. A falling barometer means the low is still coming.","Después de que un sistema de baja presión se mueve hacia el este, llega alta presión con vientos fríos del noroeste. Un barómetro que sube indica esta situación. Un barómetro que baja significa que la baja presión todavía viene.","Après qu'une dépression s'est déplacée vers l'est, un anticyclone suit avec des vents froids du nord-ouest. Un baromètre en hausse signale cette situation. Un baromètre en baisse veut dire que la dépression arrive encore.","Apre yon sistèm presyon ba deplase al nan lès, presyon wo vini dèyè l ak van frèt ki soti nan nòdwès. Yon bawomèt k ap monte montre sitiyasyon sa a. Yon bawomèt k ap desann vle di presyon ba a ap vini toujou.","بعد أن يتحرك منخفض جوي نحو الشرق، يتبعه مرتفع جوي مع رياح شمالية غربية باردة. البارومتر المرتفع يدل على هذا الوضع. البارومتر المنخفض يعني أن المنخفض الجوي ما زال قادمًا."],
c4h:["Wind crosses the lake","El viento cruza el lago","Le vent traverse le lac","Van an travèse lak la","الرياح تعبر البحيرة"],
c4:["The wind must blow from the open lake toward the city. A wind is named for where it comes from. If the wind comes from land, no lake moisture reaches the city.","El viento debe soplar desde el lago abierto hacia la ciudad. El nombre de un viento dice de dónde viene. Si el viento viene de la tierra, no llega humedad del lago a la ciudad.","Le vent doit souffler du lac vers la ville. Un vent porte le nom de l'endroit d'où il vient. Si le vent vient de la terre, aucune humidité du lac n'atteint la ville.","Van an dwe soufle soti nan lak la pou ale nan vil la. Non yon van di ki kote li soti. Si van an soti sou tè a, pa gen imidite lak la ki rive nan vil la.","يجب أن تهبّ الرياح من البحيرة المفتوحة نحو المدينة. تُسمّى الرياح باسم الجهة التي تأتي منها. إذا جاءت الرياح من اليابسة، فلن تصل رطوبة البحيرة إلى المدينة."],

bonusSteps:["Pick a city near one of the Great Lakes. Write a lake-effect scenario with real conditions. Include the lake temperature, air temperature, wind direction and speed, and barometer. Trade with a partner and answer each other's question.","Elige una ciudad cerca de uno de los Grandes Lagos. Escribe un caso de efecto lago con condiciones reales. Incluye la temperatura del lago, la temperatura del aire, la dirección y velocidad del viento y el barómetro. Intercambia con un compañero y respondan la pregunta del otro.","Choisis une ville près d'un des Grands Lacs. Écris un scénario d'effet de lac avec de vraies conditions. Mets la température du lac, la température de l'air, la direction et la vitesse du vent, et le baromètre. Échange avec un partenaire et répondez chacun à la question de l'autre.","Chwazi yon vil ki toupre youn nan Gran Lak yo. Ekri yon sitiyasyon efè lak ak vrè kondisyon. Mete tanperati lak la, tanperati lè a, direksyon ak vitès van an, ak bawomèt la. Fè echanj ak yon patnè epi reponn kesyon youn lòt.","اختر مدينة قريبة من إحدى البحيرات العظمى. اكتب حالة لتأثير البحيرة بظروف حقيقية. اذكر درجة حرارة البحيرة ودرجة حرارة الهواء واتجاه الرياح وسرعتها والبارومتر. تبادل مع زميل وأجب كلٌّ منكما عن سؤال الآخر."],

 note_:["The low-pressure system moved east into New York State.","El sistema de baja presión se movió al este, hacia el estado de Nueva York.","La dépression s'est déplacée vers l'est, dans l'État de New York.","Sistèm presyon ba a deplase al nan lès, nan eta New York.","تحرك المنخفض الجوي شرقًا إلى ولاية نيويورك."],
 hint:["Do north winds reach Michigan City over open lake water? How big is the temperature gap?","¿Los vientos del norte llegan a Michigan City sobre agua abierta del lago? ¿Qué tan grande es la diferencia de temperatura?","Les vents du nord arrivent-ils à Michigan City au-dessus de l'eau du lac ? Quelle est la taille de l'écart de température ?","Èske van nò yo rive Michigan City sou dlo lak la? Konbyen diferans tanperati a ye?","هل تصل الرياح الشمالية إلى ميشيغان سيتي فوق مياه البحيرة المفتوحة؟ ما حجم فرق درجات الحرارة؟"],
 cause:["Look at the map again. North winds cross the whole length of Lake Michigan to reach Michigan City. The gap is 31°F, and the barometer is rising.","Mira el mapa otra vez. Los vientos del norte cruzan todo el largo del lago Míchigan para llegar a Michigan City. La diferencia es de 31°F y el barómetro está subiendo.","Regarde encore la carte. Les vents du nord traversent toute la longueur du lac Michigan pour arriver à Michigan City. L'écart est de 31°F, et le baromètre est en hausse.","Gade kat la ankò. Van nò yo travèse tout longè lak Michigan pou yo rive Michigan City. Diferans lan se 31°F, epi bawomèt la ap monte.","انظر إلى الخريطة مرة أخرى. تعبر الرياح الشمالية بحيرة ميشيغان بطولها كله لتصل إلى ميشيغان سيتي. الفرق 31°F، والبارومتر يرتفع."],
 why:["Lake-effect snow is likely. The gap is very large (31°F). North winds cross the whole length of Lake Michigan, so the fetch is long. The barometer is rising because the low moved east.","Es probable la nieve por efecto lago. La diferencia es muy grande (31°F). Los vientos del norte cruzan todo el largo del lago Míchigan, así que el fetch es largo. El barómetro sube porque la baja presión se movió al este.","La neige d'effet de lac est probable. L'écart est très grand (31°F). Les vents du nord traversent toute la longueur du lac Michigan, donc le fetch est long. Le baromètre monte parce que la dépression est partie vers l'est.","Nèj efè lak gen chans rive. Diferans lan gwo anpil (31°F). Van nò yo travèse tout longè lak Michigan, kidonk fetch la long. Bawomèt la ap monte paske presyon ba a deplase al nan lès.","ثلج تأثير البحيرة محتمل. الفرق كبير جدًا (31°F). تعبر الرياح الشمالية بحيرة ميشيغان بطولها كله، فمسافة العبور طويلة. البارومتر يرتفع لأن المنخفض تحرك شرقًا."]},
{city:"Erie, Pennsylvania",lon:-80.08,lat:42.13,lx:10,ly:24,anc:'start',lake:33,air:30,wd:180,wk:'wS',mph:'light',baro:'bSteady',ans:'no',
 press:[{t:'H',lon:-76.4,lat:41.05,east:1}],
 note_:["The high-pressure system moved east into New Jersey.","El sistema de alta presión se movió al este, hacia Nueva Jersey.","L'anticyclone s'est déplacé vers l'est, dans le New Jersey.","Sistèm presyon wo a deplase al nan lès, nan New Jersey.","تحرك المرتفع الجوي شرقًا إلى نيوجيرسي."],
 hint:["Does a south wind reach Erie from land or from the lake? Is 3°F a big gap?","¿Un viento del sur llega a Erie desde la tierra o desde el lago? ¿Es grande una diferencia de 3°F?","Un vent du sud arrive-t-il à Erie de la terre ou du lac ? Un écart de 3°F, est-ce grand ?","Èske yon van sid rive Erie soti sou tè a oswa soti nan lak la? Èske 3°F se yon gwo diferans?","هل تصل الرياح الجنوبية إلى إيري من اليابسة أم من البحيرة؟ هل 3°F فرق كبير؟"],
 cause:["Look at the map again. A south wind reaches Erie from land, not across Lake Erie. The gap is only 3°F.","Mira el mapa otra vez. Un viento del sur llega a Erie desde la tierra, no cruzando el lago Erie. La diferencia es de solo 3°F.","Regarde encore la carte. Un vent du sud arrive à Erie de la terre, pas en traversant le lac Érié. L'écart n'est que de 3°F.","Gade kat la ankò. Yon van sid rive Erie soti sou tè a, li pa travèse lak Eri. Diferans lan se 3°F sèlman.","انظر إلى الخريطة مرة أخرى. تصل الرياح الجنوبية إلى إيري من اليابسة، لا عبر بحيرة إيري. الفرق 3°F فقط."],
 why:["Lake-effect snow is not likely. A south wind comes from land, so there is no fetch over Lake Erie. The gap is only 3°F, which is too small.","No es probable la nieve por efecto lago. Un viento del sur viene de la tierra, así que no hay fetch sobre el lago Erie. La diferencia es de solo 3°F, que es muy poca.","La neige d'effet de lac n'est pas probable. Un vent du sud vient de la terre, donc il n'y a pas de fetch sur le lac Érié. L'écart n'est que de 3°F, c'est trop petit.","Nèj efè lak pa gen chans rive. Yon van sid soti sou tè a, kidonk pa gen fetch sou lak Eri. Diferans lan se 3°F sèlman, sa twò piti.","ثلج تأثير البحيرة غير محتمل. الرياح الجنوبية تأتي من اليابسة، فلا توجد مسافة عبور فوق بحيرة إيري. الفرق 3°F فقط، وهو صغير جدًا."]},
{city:"Kingston, Ontario",lon:-76.48,lat:44.23,lx:-10,ly:-14,anc:'end',lake:33,air:20,wd:225,wk:'wSW',mph:9,baro:'bFall',ans:'no',
 press:[{t:'L',lon:-78.3,lat:44.45,east:0}],
 note_:["A low-pressure system is just west, over Peterborough, Ontario.","Hay un sistema de baja presión justo al oeste, sobre Peterborough, Ontario.","Une dépression est juste à l'ouest, au-dessus de Peterborough, en Ontario.","Gen yon sistèm presyon ba jis nan lwès, sou Peterborough, Ontario.","يوجد منخفض جوي إلى الغرب مباشرة، فوق بيتربورو في أونتاريو."],
 hint:["Lake-effect snow usually comes after a low passes east and high pressure follows. What is the barometer doing?","La nieve por efecto lago casi siempre llega después de que una baja presión pasa al este y la sigue la alta presión. ¿Qué está haciendo el barómetro?","La neige d'effet de lac arrive d'habitude après qu'une dépression passe vers l'est et qu'un anticyclone suit. Que fait le baromètre ?","Nèj efè lak konn vini apre yon presyon ba pase al nan lès epi presyon wo vini dèyè l. Kisa bawomèt la ap fè?","يأتي ثلج تأثير البحيرة عادةً بعد أن يمر المنخفض شرقًا ويتبعه مرتفع جوي. ماذا يفعل البارومتر؟"],
 cause:["Look at the barometer again. It is falling, so the low has not passed yet. The gap is also small (13°F).","Mira otra vez el barómetro. Está bajando, así que la baja presión todavía no ha pasado. La diferencia también es pequeña (13°F).","Regarde encore le baromètre. Il est en baisse, donc la dépression n'est pas encore passée. L'écart est aussi petit (13°F).","Gade bawomèt la ankò. L ap desann, kidonk presyon ba a poko pase. Diferans lan piti tou (13°F).","انظر إلى البارومتر مرة أخرى. إنه ينخفض، أي أن المنخفض لم يمرّ بعد. والفرق صغير أيضًا (13°F)."],
 why:["Lake-effect snow is not likely. The barometer is falling because the low is still coming from the west. Lake-effect snow comes after the low passes east and cold northwest winds follow. The gap is also small (13°F).","No es probable la nieve por efecto lago. El barómetro baja porque la baja presión todavía viene del oeste. La nieve por efecto lago llega después de que la baja pasa al este y siguen vientos fríos del noroeste. La diferencia también es pequeña (13°F).","La neige d'effet de lac n'est pas probable. Le baromètre baisse parce que la dépression arrive encore de l'ouest. La neige d'effet de lac vient après que la dépression passe vers l'est et que des vents froids du nord-ouest suivent. L'écart est aussi petit (13°F).","Nèj efè lak pa gen chans rive. Bawomèt la ap desann paske presyon ba a ap vini toujou soti nan lwès. Nèj efè lak vini apre presyon ba a pase al nan lès epi van frèt nòdwès vini dèyè l. Diferans lan piti tou (13°F).","ثلج تأثير البحيرة غير محتمل. البارومتر ينخفض لأن المنخفض ما زال قادمًا من الغرب. يأتي ثلج تأثير البحيرة بعد أن يمر المنخفض شرقًا وتتبعه رياح شمالية غربية باردة. والفرق صغير أيضًا (13°F)."]},
{city:"Marquette, Michigan",lon:-87.4,lat:46.55,lx:10,ly:24,anc:'start',lake:33,air:-10,wd:0,wk:'wN',mph:20,baro:'bRise',ans:'yes',amt:'aHeavy',
 press:[],
 note_:["A classic setup after a cold front passes.","Una situación típica después de que pasa un frente frío.","Une situation classique après le passage d'un front froid.","Yon sitiyasyon klasik apre yon fwon frèt pase.","وضع نموذجي بعد مرور جبهة باردة."],
 hint:["The gap is huge. North winds blow across Lake Superior toward Marquette. How does a very long fetch change the amount of snow?","La diferencia es enorme. Los vientos del norte soplan sobre el lago Superior hacia Marquette. ¿Cómo cambia la cantidad de nieve con un fetch muy largo?","L'écart est énorme. Les vents du nord soufflent sur le lac Supérieur vers Marquette. Comment un fetch très long change-t-il la quantité de neige ?","Diferans lan gwo anpil. Van nò yo soufle sou lak Siperyè pou ale Marquette. Kijan yon fetch ki long anpil chanje kantite nèj la?","الفرق هائل. تهبّ الرياح الشمالية فوق بحيرة سوبيريور نحو ماركيت. كيف تغيّر مسافة العبور الطويلة جدًا كمية الثلج؟"],
 cause:["Look at the map again. North winds cross the widest part of Lake Superior. The gap is 43°F, and the barometer is rising.","Mira el mapa otra vez. Los vientos del norte cruzan la parte más ancha del lago Superior. La diferencia es de 43°F y el barómetro está subiendo.","Regarde encore la carte. Les vents du nord traversent la partie la plus large du lac Supérieur. L'écart est de 43°F, et le baromètre est en hausse.","Gade kat la ankò. Van nò yo travèse pati ki pi laj nan lak Siperyè. Diferans lan se 43°F, epi bawomèt la ap monte.","انظر إلى الخريطة مرة أخرى. تعبر الرياح الشمالية أعرض جزء من بحيرة سوبيريور. الفرق 43°F، والبارومتر يرتفع."],
 amtCause:["Your Yes is right. Now look at the amount again. A huge gap and a very long fetch give the most snow.","Tu Sí es correcto. Ahora mira otra vez la cantidad. Una diferencia enorme y un fetch muy largo dan la mayor cantidad de nieve.","Ton Oui est juste. Regarde encore la quantité. Un écart énorme et un fetch très long donnent le plus de neige.","Wi ou a bon. Kounye a, gade kantite a ankò. Yon diferans ki gwo anpil ak yon fetch ki long anpil bay plis nèj.","إجابتك «نعم» صحيحة. انظر الآن إلى الكمية مرة أخرى. الفرق الهائل ومسافة العبور الطويلة جدًا يعطيان أكبر كمية من الثلج."],
 why:["Lake-effect snow is likely, and it will be heavy. The gap is huge (43°F). North winds cross the whole width of Lake Superior, so the fetch is very long. The barometer is rising.","Es probable la nieve por efecto lago, y será mucha. La diferencia es enorme (43°F). Los vientos del norte cruzan todo el ancho del lago Superior, así que el fetch es muy largo. El barómetro está subiendo.","La neige d'effet de lac est probable, et elle sera forte. L'écart est énorme (43°F). Les vents du nord traversent toute la largeur du lac Supérieur, donc le fetch est très long. Le baromètre est en hausse.","Nèj efè lak gen chans rive, epi l ap anpil. Diferans lan gwo anpil (43°F). Van nò yo travèse tout lajè lak Siperyè, kidonk fetch la long anpil. Bawomèt la ap monte.","ثلج تأثير البحيرة محتمل، وسيكون كثيفًا. الفرق هائل (43°F). تعبر الرياح الشمالية بحيرة سوبيريور بعرضها كله، فمسافة العبور طويلة جدًا. البارومتر يرتفع."]},
{city:"Holland, Michigan",lon:-86.11,lat:42.79,lx:12,ly:6,anc:'start',lake:32,air:12,wd:225,wk:'wSW',mph:null,baro:'bRise',ans:'yes',gary:1,
 press:[{t:'H',lon:-84.7,lat:43.75,east:0}],
 note_:["A large high-pressure system is over central Michigan.","Un gran sistema de alta presión está sobre el centro de Míchigan.","Un grand anticyclone est au-dessus du centre du Michigan.","Yon gwo sistèm presyon wo sou mitan Michigan.","يوجد مرتفع جوي كبير فوق وسط ميشيغان."],
 hint:["Southwest winds cross only the southern tip of Lake Michigan, so the fetch is short. What do those winds pass over before they reach the lake?","Los vientos del suroeste cruzan solo la punta sur del lago Míchigan, así que el fetch es corto. ¿Sobre qué pasan esos vientos antes de llegar al lago?","Les vents du sud-ouest traversent seulement la pointe sud du lac Michigan, donc le fetch est court. Au-dessus de quoi passent ces vents avant d'arriver au lac ?","Van sidwès yo travèse sèlman pwent sid lak Michigan, kidonk fetch la kout. Sou kisa van sa yo pase anvan yo rive nan lak la?","تعبر الرياح الجنوبية الغربية الطرف الجنوبي فقط من بحيرة ميشيغان، فمسافة العبور قصيرة. فوق ماذا تمر هذه الرياح قبل أن تصل إلى البحيرة؟"],
 cause:["Look at the map again. Before the wind reaches the lake, it passes over the steel mills in Gary, Indiana. The mills add heat and tiny particles to the air.","Mira el mapa otra vez. Antes de llegar al lago, el viento pasa sobre las acerías de Gary, Indiana. Las acerías le agregan calor y partículas diminutas al aire.","Regarde encore la carte. Avant d'arriver au lac, le vent passe au-dessus des aciéries de Gary, en Indiana. Les aciéries ajoutent de la chaleur et de minuscules particules à l'air.","Gade kat la ankò. Anvan van an rive nan lak la, li pase sou faktori asye yo nan Gary, Indiana. Faktori yo ajoute chalè ak ti patikil nan lè a.","انظر إلى الخريطة مرة أخرى. قبل أن تصل الرياح إلى البحيرة، تمر فوق مصانع الصلب في غاري بولاية إنديانا. تضيف المصانع حرارة وجسيمات دقيقة إلى الهواء."],
 why:["Lake-effect snow is likely. The fetch is short, but the air first passes over the steel mills in Gary, Indiana. The mills add heat and tiny particles (nuclei) that help snowflakes form. The barometer is also rising.","Es probable la nieve por efecto lago. El fetch es corto, pero el aire primero pasa sobre las acerías de Gary, Indiana. Las acerías agregan calor y partículas diminutas (núcleos) que ayudan a formar copos de nieve. El barómetro también está subiendo.","La neige d'effet de lac est probable. Le fetch est court, mais l'air passe d'abord au-dessus des aciéries de Gary, en Indiana. Les aciéries ajoutent de la chaleur et de minuscules particules (noyaux) qui aident les flocons à se former. Le baromètre est aussi en hausse.","Nèj efè lak gen chans rive. Fetch la kout, men lè a pase anvan sou faktori asye yo nan Gary, Indiana. Faktori yo ajoute chalè ak ti patikil (nwayo) ki ede flòk nèj fòme. Bawomèt la ap monte tou.","ثلج تأثير البحيرة محتمل. مسافة العبور قصيرة، لكن الهواء يمر أولًا فوق مصانع الصلب في غاري بولاية إنديانا. تضيف المصانع حرارة وجسيمات دقيقة (نوى) تساعد على تكوّن رقاقات الثلج. والبارومتر يرتفع أيضًا."]},
{city:"Stevens Point, Wisconsin",lon:-89.57,lat:44.52,lx:-12,ly:6,anc:'end',lake:32,air:10,wd:315,wk:'wNW',mph:8,baro:'bRise',ans:'no',
 press:[],
 note_:["A normal winter setup.","Una situación normal de invierno.","Une situation d'hiver normale.","Yon sitiyasyon nòmal pou ivè.","وضع شتوي عادي."],
 hint:["Find Stevens Point (city 6) on the map. Is it on the shore of a Great Lake?","Busca Stevens Point (ciudad 6) en el mapa. ¿Está en la orilla de uno de los Grandes Lagos?","Trouve Stevens Point (ville 6) sur la carte. Est-elle sur la rive d'un des Grands Lacs ?","Chèche Stevens Point (vil 6) sou kat la. Èske li bò rivaj yon Gran Lak?","ابحث عن ستيفنز بوينت (المدينة 6) على الخريطة. هل تقع على شاطئ إحدى البحيرات العظمى؟"],
 cause:["Look at the map again. Stevens Point is not on a Great Lake. The air has no lake to cross.","Mira el mapa otra vez. Stevens Point no está en uno de los Grandes Lagos. El aire no tiene un lago que cruzar.","Regarde encore la carte. Stevens Point n'est pas sur un des Grands Lacs. L'air n'a pas de lac à traverser.","Gade kat la ankò. Stevens Point pa bò yon Gran Lak. Lè a pa gen okenn lak pou l travèse.","انظر إلى الخريطة مرة أخرى. ستيفنز بوينت لا تقع على إحدى البحيرات العظمى. لا توجد بحيرة يعبرها الهواء."],
 why:["Lake-effect snow is not likely. Stevens Point, Wisconsin, is not on a Great Lake. The air is cold and the barometer is rising, but there is no lake to add heat and moisture.","No es probable la nieve por efecto lago. Stevens Point, Wisconsin, no está en uno de los Grandes Lagos. El aire está frío y el barómetro sube, pero no hay un lago que agregue calor y humedad.","La neige d'effet de lac n'est pas probable. Stevens Point, au Wisconsin, n'est pas sur un des Grands Lacs. L'air est froid et le baromètre monte, mais il n'y a pas de lac pour ajouter chaleur et humidité.","Nèj efè lak pa gen chans rive. Stevens Point, Wisconsin, pa bò yon Gran Lak. Lè a frèt epi bawomèt la ap monte, men pa gen lak pou ajoute chalè ak imidite.","ثلج تأثير البحيرة غير محتمل. ستيفنز بوينت في ويسكونسن لا تقع على إحدى البحيرات العظمى. الهواء بارد والبارومتر يرتفع، لكن لا توجد بحيرة تضيف الحرارة والرطوبة."]},
{city:"Duluth, Minnesota",lon:-92.1,lat:46.78,lx:-10,ly:24,anc:'end',lake:32,air:-8,wd:315,wk:'wNW',mph:18,baro:'bSteady',ans:'no',
 press:[],

function fbHtml(part,fallbackKey){
  const f=S.fb[part];
  if(!f){if(!fallbackKey)return `<div class="fb"></div>`;return `<div class="fb"><div>${B(fallbackKey)}</div>${sayK(fallbackKey)}</div>`;}
  const en=f.parts.map(([k,v])=>U(k,v,'en')).join(' '),l2=f.parts.map(([k,v])=>U(k,v,S.lang)).join(' ');
  return `<div class="fb ${f.type}"><div><span class="en">${esc(en)}</span>${l2span(l2)}</div>${sayBtn(()=>[en,l2])}</div>`;}
function supports(taId,list,wordsList,dis){
  const fr=list.map((f,i)=>`<button type="button" class="frame" id="fr-${taId}-${i}" data-act="ins" data-ta="${taId}" data-txt="${esc(f[0])}" data-line="1"${dis?' disabled':''}>${BA(f)}</button>`).join('');
  const wd=(wordsList||[]).map((w,i)=>`<button type="button" class="word" id="wd-${taId}-${i}" data-act="ins" data-ta="${taId}" data-txt="${esc(w[0])}"${dis?' disabled':''}><span class="inl">${BA(w)}</span></button>`).join('');
  return `<details class="sup" id="det-${taId}"${openDet.has('det-'+taId)?' open':''}><summary>${BI('frames')}</summary>
  <p class="note" style="margin:4px 0">${BI('framesTip')}</p><div class="frames">${fr}</div>
  ${wd?`<p class="eyebrow" style="margin-top:10px">${BI('wordBank')}</p><div class="words">${wd}</div>`:''}</details>`;}
function vocabBlock(list){
  if(!S.pics)return '';
  const cards=list.map(k=>{const g=GL[k];const en=g.en,l=g[S.lang]||g.en;
    return `<div class="vcard"><div class="pic">${vIcon(k)}</div><div style="flex:1;min-width:0"><b>${esc(en[0])}</b>${S.lang!=='en'?l2span(l[0]):''}<p>${esc(en[1])}</p>${S.lang!=='en'?l2span(l[1]):''}</div>${sayBtn(()=>[en[0]+'. '+en[1],l[0]+'. '+l[1]])}</div>`;}).join('');
  return `<div class="panel"><p class="eyebrow">${BI('picsHead')}</p><div class="vocab">${cards}</div></div>`;}

/* ---------- HEADER + TABS ---------- */
const TABS=[['learn','tabL'],['forecast','tabF'],['turnin','tabT']];
function header(){
  const opts=LANGS.map(l=>`<option value="${l}"${S.lang===l?' selected':''}>${esc(LANG_NAMES[l])}</option>`).join('');
  const done=S.sc.filter(s=>s.ok).length;
  return `<header class="top"><div class="brand"><svg width="42" height="42" viewBox="0 0 56 56" aria-hidden="true"><rect width="56" height="56" rx="12" class="f-sky"/>${vIcon('lakeEffect').replace(/<svg[^>]*>|<\/svg>/g,'')}</svg>
  <div><h1>${B('title')}</h1><p>${BI('sub')}</p></div></div>
  <div class="tools"><label for="lang">${BI('lang')}</label><select id="lang" data-act="lang">${opts}</select>
  <button type="button" class="btn" id="picsBtn" data-act="pics" aria-pressed="${S.pics}">${BI('pics')}</button>
  <button type="button" class="btn" id="themeBtn" data-act="theme">${BI('theme')}</button></div></header>
  <nav class="tabs" role="tablist" aria-label="Lab parts">${TABS.map(([id,k])=>`<button type="button" role="tab" class="tab" id="tab-${id}" data-act="tab" data-arg="${id}" aria-selected="${S.tab===id}"><span>${B(k)}</span>${id==='forecast'?`<span class="chip">${done}/8</span>`:''}</button>`).join('')}</nav>`;}

/* ---------- LEARN ---------- */
function renderLearn(){
  const steps=[1,2,3,4].map(n=>`<div class="step"><div style="display:flex;gap:8px;align-items:center;justify-content:space-between"><span class="n" aria-hidden="true">${n}</span>${sayBtn(()=>[U('st'+n+'h',null,'en')+'. '+U('st'+n,null,'en'),U('st'+n+'h')+'. '+U('st'+n)])}</div><h3>${B('st'+n+'h')}</h3><p>${B('st'+n)}</p></div>`).join('');
  const icons=['gap','fetch','barometer','cross'];
  const conds=[1,2,3,4].map(n=>`<div class="cond"><div class="ico">${vIcon(icons[n-1],60)}</div><div class="txt"><h3>${B('c'+n+'h')}</h3>${sayBtn(()=>[U('c'+n+'h',null,'en')+'. '+U('c'+n,null,'en'),U('c'+n+'h')+'. '+U('c'+n)])}</div><p>${B('c'+n)}</p></div>`).join('');
  return `<section class="part" aria-labelledby="h-learn">
  <div class="panel hero"><div><h2 id="h-learn">${B('introHead')}</h2>${txt('intro',null,'lead')}
    <button type="button" class="btn primary" id="startBtn" data-act="start">${BI('start')} →</button></div>
    <figure style="margin:0">${xsection()}<figcaption class="cap">${BI('diagCap')}</figcaption></figure></div>
  <div class="panel"><h2 style="font-size:1.25rem;margin-bottom:10px">${B('howHead')}</h2><div class="steps4">${steps}</div></div>
  <div class="panel"><h2 style="font-size:1.25rem;margin-bottom:10px">${B('checkHead')}</h2><div class="conds">${conds}</div>
    <div style="margin-top:12px"><button type="button" class="btn primary" id="startBtn2" data-act="start">${BI('start')} →</button></div></div>
  ${vocabBlock(VOCAB_LEARN)}</section>`;}

/* ---------- FORECAST ---------- */
function windText(sc,l){let t=U(sc.wk,null,l);if(sc.mph==='light')t+=', '+U('wLight',null,l).toLowerCase();else if(sc.mph)t+=', '+sc.mph+' mph';return t;}
function renderForecast(){
  const i=S.cur,sc=SC[i],st=S.sc[i],lock=st.ok;
  const dots=SC.map((c,j)=>{const s=S.sc[j];const cls=s.ok?'ok':(s.checks?'no':'');const mk=s.ok?'✓':(s.checks?'✗':'');
    const lab=`Scenario ${j+1}: ${c.city}${s.ok?', correct':s.checks?', not yet correct':''}`;
    return `<button type="button" class="dot ${cls}" id="dot-${j}" data-act="go" data-arg="${j}" aria-label="${esc(lab)}"${j===i?' aria-current="step"':''}>${j+1}${mk?`<span aria-hidden="true">${mk}</span>`:''}</button>`;}).join('');
  const gap=sc.lake-sc.air;
  const gapK=gap>=0?'gapWarm':'gapCold';
  const windSub=sc.mph==='light'?B('wLight'):sc.mph?`<span class="en num">${sc.mph} mph</span>`:B('wNoSpeed');
  const tiles=`<div class="tiles">
    <div class="tile t-temp"><span class="tl">${BI('lakeT')}</span>${thermo(sc.lake,sc.air)}
      <div class="tvals"><div><b>${BI('lakeS')}</b><span class="num">${esc(tempStr(sc.lake))}</span></div><div><b>${BI('airS')}</b><span class="num">${esc(tempStr(sc.air))}</span></div></div>
      <div class="gap">${B(gapK,{n:Math.abs(gap)})}</div><div class="note" style="text-align:center;font-size:13px">${B('bigGap')}</div></div>
    <div class="tile"><span class="tl">${BI('windT')}</span>${compass(sc)}<div class="val">${B(sc.wk)}</div><div class="note">${windSub}</div></div>
    <div class="tile"><span class="tl">${BI('baroT')}</span>${baro(sc.baro)}<div class="val">${B(sc.baro)}</div></div></div>`;
  const yn=['yes','no'].map(a=>`<button type="button" class="btn" id="ans-${a}" data-act="ans" data-arg="${a}" aria-pressed="${st.ans===a}"${lock?' disabled':''}>${BI(a)}</button>`).join('');
  const amt=sc.amt?`<div class="q" style="margin-top:10px"><div class="txt"><p style="font-weight:700">${B('qAmt')}</p>${sayK('qAmt')}</div><div class="amt" role="group">${['aLight','aMod','aHeavy'].map(a=>`<button type="button" class="btn" id="amt-${a}" data-act="amt" data-arg="${a}" aria-pressed="${st.amt===a}"${lock?' disabled':''}>${B(a)}</button>`).join('')}</div></div>`:'';
  const last=i===7;
  const side=`<div class="side">
    <div class="panel"><p class="eyebrow">${BI('scOf',{n:i+1})}</p><div class="cityhead"><h2 id="h-city">${esc(sc.city)}</h2></div>
      <div class="pnote"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="flex:none;margin-top:2px"><circle cx="12" cy="12" r="10" fill="none" class="s-mute" stroke-width="2"/><path d="M12 11v6M12 7v.5" class="s-mute" stroke-width="2.4" stroke-linecap="round"/></svg><div style="flex:1">${B('note'+i)}</div>${sayK('note'+i)}</div>
      <div style="margin-top:10px">${tiles}</div></div>
    <div class="panel q"><div class="txt"><h3>${B('qLikely')}</h3>${sayK('qLikely')}</div><div class="yn" role="group" aria-labelledby="h-city">${yn}</div>${amt}
      <div class="ev" style="margin-top:12px"><label for="ev-${i}" class="txt" style="font-weight:700"><span style="flex:1">${B('reason')}</span></label>
      <textarea id="ev-${i}" data-ev="${i}" spellcheck="true"${lock?' disabled':''}>${esc(st.ev)}</textarea>
      ${supports('ev-'+i,FRAMES,WORDS,lock)}</div>
      ${lock?'':`<button type="button" class="hintbtn" id="hintBtn" data-act="hint" aria-expanded="${hintOpen}">${BI(hintOpen?'hideHint':'hintBtn')}</button>${hintOpen?`<div class="hint">${txt('hint'+i)}</div>`:''}`}</div></div>`;
  const stage=`<div class="mapbox">${mapSVG(i)}
    <div class="legend"><span><svg width="30" height="10" aria-hidden="true"><path d="M2 5H20" class="s-${sc.air<sc.lake?'cold':'warm'}" stroke-width="5"/><path d="M28 5l-9-5v10z" class="f-${sc.air<sc.lake?'cold':'warm'}"/></svg>${BI('legWind')}</span>
    <span><svg width="18" height="18" aria-hidden="true"><circle cx="9" cy="9" r="8" class="f-surf s-hi" stroke-width="2"/><text x="9" y="13" text-anchor="middle" font-size="11" font-weight="800" class="f-hi">H</text></svg>${BI('legH')}</span>
    <span><svg width="18" height="18" aria-hidden="true"><circle cx="9" cy="9" r="8" class="f-surf s-lo" stroke-width="2"/><text x="9" y="13" text-anchor="middle" font-size="11" font-weight="800" class="f-lo">L</text></svg>${BI('legL')}</span>
    ${sc.gary?`<span><svg width="18" height="18" aria-hidden="true"><rect x="2" y="9" width="14" height="8" class="f-mute"/><rect x="4" y="2" width="3" height="8" class="f-mute"/><rect x="11" y="0" width="3" height="10" class="f-mute"/></svg>${BI('legInd')}</span>`:''}</div>
    <p class="cap" style="padding:0 4px 4px">${BI('mapCap')}</p></div>`;
  const nextBtn=`<button type="button" class="btn${st.ok?' primary':''}" id="nextBtn" data-act="${last?'toTurnIn':'next'}">${BI(last?'toTurnIn':'next')} →</button>`;
  return `<section class="part" aria-label="Forecast">
    <div class="dots" role="navigation" aria-label="Scenarios"><span class="eyebrow" style="margin:0 6px 0 0">${BI('dotsLab')}</span>${dots}</div>
    <div class="fgrid"><div>${stage}</div>${side}</div>
    <div class="actions">${fbHtml('s'+i,'ready')}<div class="act-btns"><span class="count">${esc(U('checks',{n:st.checks},'en'))}</span>
      <button type="button" class="btn primary" id="checkBtn" data-act="check"${lock?' disabled':''}>${BI('check')}</button>
      <button type="button" class="btn" id="prevBtn" data-act="prev"${i===0?' disabled':''}>← ${BI('prev')}</button>${nextBtn}</div></div>
    ${vocabBlock(VOCAB_FC)}</section>`;}
function checkSc(){
  const i=S.cur,sc=SC[i],st=S.sc[i],fk='s'+i;
  if(st.ok)return;
  const ta=document.getElementById('ev-'+i);if(ta)st.ev=ta.value;
  if(!st.ans){setFb(fk,'bad',[['notYet'],['needAns']]);return;}
  if(sc.amt&&st.ans==='yes'&&!st.amt){setFb(fk,'bad',[['notYet'],['needAmt']]);return;}
  if(words(st.ev)<3){setFb(fk,'bad',[['notYet'],['needEv']]);return;}
  st.checks++;
  const yn=st.ans===sc.ans,amtOk=!sc.amt||st.amt===sc.amt;const ok=yn&&amtOk;
  if(st.first==null)st.first=ok;
  if(ok){st.ok=true;hintOpen=false;const all=S.sc.every(s=>s.ok);setFb(fk,'good',[['correct'],['why'+i],[all?'allDone':'nextUp']]);}
  else if(yn){setFb(fk,'bad',[['notYet'],['amt'+i]]);}
  else setFb(fk,'bad',[['notYet'],['cause'+i],['tryAgain']]);}

/* ---------- TURN IN ---------- */
function scores(){return{ok:S.sc.filter(s=>s.ok).length,first:S.sc.filter(s=>s.first===true).length,checks:S.sc.reduce((n,s)=>n+s.checks,0)};}
function recordText(){
  const s=scores(),L=[];
  L.push('LAKE EFFECT SNOW FORECASTER - RESULTS');L.push('Name: '+(S.name.trim()||'(not entered)'));L.push('Class hour: '+(S.hour.trim()||'-'));
  L.push('Date: '+new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'}));L.push('');
  L.push(`SCORE: ${s.ok}/8 correct | ${s.first}/8 correct on first try | ${s.checks} checks in all`);L.push('');
  SC.forEach((c,i)=>{const st=S.sc[i];
    const ans=st.ans?(st.ans==='yes'?'Yes':'No')+(c.amt&&st.ans==='yes'&&st.amt?' ('+U(st.amt,null,'en').toLowerCase()+' snow)':''):'(no answer)';
    L.push(`SCENARIO ${i+1}: ${c.city}`);
    L.push(`  Answer: ${ans} - ${st.ok?'OK':'X'} | checks: ${st.checks} | first try: ${st.first==null?'-':st.first?'OK':'X'}`);
    L.push('  Reasoning: '+(st.ev.trim()||'(blank)'));});
  L.push('');L.push('BONUS - MY OWN SCENARIO');L.push('  '+(S.bonus.trim()||'(blank)'));
  return L.join('\n');}
function renderTurnIn(){
  const s=scores();
  const sum=(k,v)=>`<div class="sum"><b>${v}</b><div>${B(k)}</div></div>`;
  return `<section class="part" aria-labelledby="h-bonus">
  <div class="panel bonus"><div class="txt"><h2 id="h-bonus" style="font-size:1.25rem;flex:1">${B('bonusHead')}</h2></div>
    <div style="margin-top:6px">${txt('bonusSteps')}</div>
    <label for="bonus" class="note" style="display:block;margin:10px 0 4px">${BI('answer')}</label>
    <textarea id="bonus" data-f="bonus" spellcheck="true">${esc(S.bonus)}</textarea>
    ${supports('bonus',[BONUS_FRAME],WORDS)}</div>
  <div class="panel side" style="gap:12px"><h2 id="h-p4" style="font-size:1.25rem">${B('p4Head')}</h2>${txt('p4Steps')}
    <div class="form"><label for="stuName">${BI('name')} *<input type="text" id="stuName" data-f="name" autocomplete="name" value="${esc(S.name)}"></label>
    <label for="stuHour">${BI('hour')}<input type="text" id="stuHour" data-f="hour" value="${esc(S.hour)}"></label></div>
    <div class="sumgrid">${sum('sumOk',s.ok+'/8')}${sum('sumFirst',s.first+'/8')}${sum('sumChecks',s.checks)}${sum('sumBonus',S.bonus.trim()?'✓':'–')}</div>
    <div class="act-btns"><button type="button" class="btn primary" id="pdfBtn" data-act="pdf">${BI('pdf')}</button><button type="button" class="btn" id="copyBtn" data-act="copy">${BI('copy')}</button></div>
    <div id="tiMsg" aria-live="polite">${S.fb.ti?fbHtml('ti'):''}</div>
    <label for="rec" class="eyebrow">${BI('preview')}</label>
    <textarea id="rec" class="rec" readonly>${esc(recordText())}</textarea></div></section>`;}
let dlP=null;
async function makePdf(){
  if(!S.name.trim()){setFb('ti','bad',[['needName']]);render();document.getElementById('stuName').focus();return;}
  if(!window.jspdf){setFb('ti','bad',[['pdfFail']]);render();return;}
  const txtR=recordText();const warn=/[^\x00-\xFF]/.test(S.sc.map(s=>s.ev).join('')+S.bonus+S.name);
  const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'pt',format:'letter'});
  let y=56;doc.setFontSize(10.5);
  txtR.split('\n').forEach(line=>{const bold=/^(LAKE|SCORE|SCENARIO|BONUS)/.test(line);doc.setFont('helvetica',bold?'bold':'normal');
    doc.splitTextToSize(line.replace(/−/g,'-').replace(/[^\x00-\xFF]/g,'?')||' ',520).forEach(l=>{if(y>740){doc.addPage();y=56;}doc.text(l,46,y);y+=14;});});
  const fname='lake-effect-'+(S.name.trim().replace(/[^a-z0-9]+/gi,'-').toLowerCase()||'student')+'.pdf';
  const blob=doc.output('blob');let dl=null;try{if(dlP)dl=await dlP;}catch(e){}
  const extra=warn?[['pdfArabic']]:[];
  if(dl){try{await dl.save({filename:fname,data:blob});setFb('ti','good',[['pdfSaved'],...extra]);}catch(err){if(!(err&&err.code==='declined'))setFb('ti','bad',[['pdfFail']]);}}
  else{try{doc.save(fname);setFb('ti','good',[['pdfSaved'],...extra]);}catch(e){setFb('ti','bad',[['pdfFail']]);}}
  save();render();}
function copyRec(){
  if(!S.name.trim()){setFb('ti','bad',[['needName']]);render();document.getElementById('stuName').focus();return;}
  const t=recordText();const fail=()=>{setFb('ti','bad',[['copyFail']]);render();const r=document.getElementById('rec');r.focus();r.select();};
  try{navigator.clipboard.writeText(t).then(()=>{setFb('ti','good',[['copied']]);render();},fail);}catch(e){fail();}}

/* ---------- RENDER ---------- */
const app=document.getElementById('app');
function render(){
  const fid=document.activeElement&&document.activeElement.id;
  SAY.clear();sid=0;
  const part={learn:renderLearn,forecast:renderForecast,turnin:renderTurnIn}[S.tab]();
  app.innerHTML=header()+`<main>${part}</main><p class="foot">${BI('credit')}</p>`;
  if(fid){const el=document.getElementById(fid);if(el&&!el.disabled)el.focus({preventScroll:true});}
}
function goSc(j){const ta=document.getElementById('ev-'+S.cur);if(ta)S.sc[S.cur].ev=ta.value;S.cur=j;hintOpen=false;S.tab='forecast';}

/* ---------- EVENTS ---------- */
app.addEventListener('click',e=>{
  const sb=e.target.closest('[data-say]');if(sb){const f=SAY.get(sb.dataset.say);if(f){const[a,b]=f();speak(a,b);}return;}
  const t=e.target.closest('[data-act]');if(!t||t.tagName==='SELECT'||t.disabled)return;
  const a=t.dataset.act,arg=t.dataset.arg;
  switch(a){
    case 'tab':if(S.tab==='forecast')goSc(S.cur);S.tab=arg;window.scrollTo(0,0);break;
    case 'start':S.tab='forecast';window.scrollTo(0,0);break;
    case 'pics':S.pics=!S.pics;break;
    case 'theme':{const r=document.documentElement;const cur=r.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');const nx=cur==='dark'?'light':'dark';r.dataset.theme=nx;try{localStorage.setItem(KEY+'-theme',nx);}catch(err){}return;}
    case 'go':goSc(+arg);break;
    case 'prev':if(S.cur>0)goSc(S.cur-1);window.scrollTo(0,0);break;
    case 'next':if(S.cur<7)goSc(S.cur+1);window.scrollTo(0,0);break;
    case 'toTurnIn':goSc(S.cur);S.tab='turnin';window.scrollTo(0,0);break;
    case 'ans':{const st=S.sc[S.cur];st.ans=arg;if(arg==='no')st.amt=null;break;}
    case 'amt':S.sc[S.cur].amt=arg;break;
    case 'hint':hintOpen=!hintOpen;break;
    case 'check':checkSc();break;
    case 'pdf':makePdf();return;
    case 'copy':copyRec();return;
    case 'ins':{const id=t.dataset.ta,ta=document.getElementById(id);if(!ta||ta.disabled)return;let add=t.dataset.txt;const v=ta.value;
      const pos=ta.selectionStart!=null&&document.activeElement===ta?ta.selectionStart:v.length;
      const before=v.slice(0,pos),after=v.slice(pos);
      if(t.dataset.line&&before.trim())add=(/[.!?]\s*$/.test(before)?' ':'. ')+add;else if(before&&!/\s$/.test(before))add=' '+add;
      ta.value=before+add+after;syncTa(ta);ta.focus();const np=(before+add).length;ta.setSelectionRange(np,np);return;}
    default:return;}
  save();render();});
function syncTa(t){if(t.dataset.ev!=null)S.sc[+t.dataset.ev].ev=t.value;if(t.dataset.f){S[t.dataset.f]=t.value;const r=document.getElementById('rec');if(r)r.value=recordText();}save();}
app.addEventListener('change',e=>{const t=e.target;if(t.id==='lang'){S.lang=t.value;save();render();}});
app.addEventListener('input',e=>{const t=e.target;if(t.tagName==='TEXTAREA'||t.tagName==='INPUT')syncTa(t);});
app.addEventListener('toggle',e=>{const t=e.target;if(t.tagName==='DETAILS'&&t.id){t.open?openDet.add(t.id):openDet.delete(t.id);}},true);

/* ---------- BOOT ---------- */
load();
try{const th=localStorage.getItem(KEY+'-theme');if(th)document.documentElement.dataset.theme=th;}catch(e){}
try{if(window.claude&&typeof window.claude.use==='function')dlP=window.claude.use('downloads');}catch(e){}
if('speechSynthesis' in window){speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{};}
render();
</script>
